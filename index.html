<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El AFA</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel_="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <div id="dialogue-box">
            <p id="dialogue-text"></p>
        </div>
        <div id="scene-container">
            <canvas id="game-canvas" width="800" height="350"></canvas>
        </div>
        <div id="ui-container">
            <div id="action-container">
                <div id="left-panel">
                    <div id="character-switcher"></div>
                </div>
                <div id="center-panel">
                    <div id="action-box">
                        <p id="action-text"></p>
                    </div>
                    <div id="verb-bar">
                        <!-- Se completa dinamicamente con los botones -->
                    </div>
                </div>
                <div id="right-panel">
                    <div id="inventory-box"></div>
                </div>
            </div>
            <div id="dialogue-container"></div>
        </div>
    </div>

    <!-- Scripts del Juego -->
    <script type="module" src="runtime.js"></script>
    <script type="module" src="api.js"></script>
    <script type="module" src="renderer.js"></script>
    <script type="module" src="data.js"></script>
    <script type="module" src="game.js"></script>
    <script type="module" src="ui.js"></script>
</body>

</html>
